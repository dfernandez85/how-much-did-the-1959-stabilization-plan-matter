name: Reproducibility Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true

      - name: Restore renv environment
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1

      # The pinned input is immutable and checksum-validated by the pipeline, so
      # caching it is safe: a cache hit skips the upstream fetch, and a stale or
      # corrupted file fails validation and is re-downloaded. This keeps the
      # check independent of Dataverse/SURF availability from the runner network.
      - name: Cache pinned raw input
        uses: actions/cache@v4
        with:
          path: data/raw/pwt110.xlsx
          key: pwt110-${{ hashFiles('data/raw/checksums.txt') }}

      - name: Run full journal pipeline
        shell: pwsh
        run: |
          Rscript main.R

      - name: Locate latest session
        id: session
        shell: pwsh
        run: |
          $sessionDir = Get-ChildItem "output/sessions" | Sort-Object Name | Select-Object -Last 1 -ExpandProperty FullName
          "path=$sessionDir" >> $env:GITHUB_OUTPUT

      - name: Upload session artifact
        uses: actions/upload-artifact@v4
        with:
          name: journal-output-session
          path: ${{ steps.session.outputs.path }}
          if-no-files-found: error
